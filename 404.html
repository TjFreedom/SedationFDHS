<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Bear Glasgow Dental</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <style>
    .error-page {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1rem;
    }
    .error-content { max-width: 480px; }
    .error-code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-content h1 { font-size: 1.75rem; margin-bottom: 1rem; }
    .error-content p { color: var(--color-muted); margin-bottom: 2rem; }
    .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="logo-wrap">
        <a href="/" aria-label="Sleepy Tooth Sedation Home">
          <img src="assets/logos/sts-logo.png" alt="Sleepy Tooth Sedation" class="logo-img" />
        </a>
      </div>
      <div class="header-cta">
        <a href="tel:+13026130041" class="btn btn-outline btn-sm">(302) 613-0041</a>
        <a href="/contact.html" class="btn btn-primary btn-sm">Book Appointment</a>
      </div>
    </div>
  </header>

  <main>
    <div class="error-page">
      <div class="error-content">
        <div class="error-code" aria-hidden="true">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you're looking for doesn't exist or may have been moved. Let us help you find what you need.</p>
        <div class="error-actions">
          <a href="/" class="btn btn-primary btn-lg">Go to Homepage</a>
          <a href="tel:+13026130041" class="btn btn-outline btn-lg">📞 Call Us</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
