[build]
  publish = "."

# Clean-URL rewrites for pediatric cluster pages (canonical URLs match these)
[[redirects]]
  from = "/pediatric-sedation-dentistry"
  to = "/pediatric-sedation-dentistry.html"
  status = 200

[[redirects]]
  from = "/nitrous-oxide-for-children"
  to = "/nitrous-oxide-for-children.html"
  status = 200

[[redirects]]
  from = "/special-needs-pediatric-dentistry"
  to = "/special-needs-pediatric-dentistry.html"
  status = 200

[[redirects]]
  from = "/childrens-dental-anxiety"
  to = "/childrens-dental-anxiety.html"
  status = 200

[[redirects]]
  from = "/pediatric-dental-procedures-sedation"
  to = "/pediatric-dental-procedures-sedation.html"
  status = 200

[[redirects]]
  from = "/pediatric-sedation-parents-guide"
  to = "/pediatric-sedation-parents-guide.html"
  status = 200

# Build files that live in the publish root but shouldn't be served
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
